name: Daily Physics Auto-Post Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # التشغيل التلقائي اليومي الساعة 00:00 UTC
  workflow_dispatch:      # إتاحة التشغيل اليدوي عبر واجهة GitHub Actions

permissions:
  contents: write

jobs:
  generate-scientist-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests

      - name: Execute Physics Pipeline Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          BATCH_SIZE: 1
        run: python physics_pipeline.py

      - name: Commit and Push Updated physicists.json Queue
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add physicists.json knowledge_base/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci(pipeline): auto-update physicists.json queue state [skip ci]" && git push)
