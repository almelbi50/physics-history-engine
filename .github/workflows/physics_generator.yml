name: Physics Generator Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-scientist-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Execute Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: "https://phy-lab.com/wp-json/wp/v2"
          WP_USER: "physics_generator"
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          python physics_pipeline.py

      - name: Commit and Push Updated Status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scientists.json knowledge_base/
          git status
          git diff-index --quiet HEAD || git commit -m "auto: process scientist and update knowledge base [skip ci]"
          git push
