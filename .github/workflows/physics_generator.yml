name: Daily Physics Auto-Post Pipeline

on:
  schedule:
    # Running daily at 09:00 UTC (12:00 PM Saudi Arabia Time)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate-scientist-draft:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Essential for git push permissions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests

      - name: Execute Physics Pipeline Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          python physics_pipeline.py

      - name: Commit and Push Updated scientists.json Queue
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scientists.json knowledge_base/
          git diff-index --quiet HEAD || (git commit -m "Auto-update: Queue state and generated Knowledge Base [skip ci]" && git push)
